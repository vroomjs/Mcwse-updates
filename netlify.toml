# Netlify configuration for vroomjs/Mcwse-updates
#
# The repository is an archive of every build, one folder per version number,
# so the repo root has no index.html. Netlify publishes "Latest", which holds
# the newest build (currently 7.7).
#
# To ship an older build instead, change `publish` to that version's folder
# name, e.g. publish = "7-6".
#
# There is no build step: these are static ES-module apps with three.js
# vendored in each version's libraries/ directory.

[build]
  publish = "Latest"

# The service worker was removed back in Deploy 6 because its cache-first
# strategy kept serving players stale bundles. Caching HTML at the edge would
# reintroduce that, so revalidate it on every request.

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
